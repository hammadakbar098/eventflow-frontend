name: Eventflow Frontend CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  AWS_ACCOUNT_ID: "751900120658"
  ECR_REPOSITORY: eventflow-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::751900120658:role/GitHubActionsEventflowFrontendRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image information
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image_uri }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_APP_NAME=EventFlow
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ vars.NEXT_PUBLIC_MEDIA_BASE_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::751900120658:role/GitHubActionsEventflowFrontendRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend to EC2 using SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09fca9ef27e2955e6" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 751900120658.dkr.ecr.eu-north-1.amazonaws.com",
              "docker pull ${{ needs.build-and-push.outputs.image_uri }}",
              "docker rm -f eventflow-frontend || true",
              "docker network inspect eventflow-network >/dev/null 2>&1 || docker network create eventflow-network",
              "docker run -d --name eventflow-frontend --restart unless-stopped --network eventflow-network -p 127.0.0.1:3001:3000 ${{ needs.build-and-push.outputs.image_uri }}"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09fca9ef27e2955e6"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09fca9ef27e2955e6"
